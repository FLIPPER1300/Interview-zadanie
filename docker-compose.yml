# Phonebook – complete stack: PostgreSQL, Keycloak, .NET 10 backend, Angular frontend.
#
# This file is self-contained: download just this file and run `docker compose up`.
# Application images are pulled from Docker Hub; the database init script and the
# Keycloak realm are embedded below (see `configs`), so no other files are needed.
#
# Inside the repository, `docker compose up --build` builds the images from source instead.
# Requires Docker Compose v2.23 or newer (Docker Desktop 4.26+).

name: phonebook

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL - one server, two databases: "keycloak" and "phonebook"
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
    configs:
      # Files in /docker-entrypoint-initdb.d run once, on the first start (empty volume).
      - source: postgres-init
        target: /docker-entrypoint-initdb.d/01-create-databases.sql
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Keycloak - login page and token issuer; realm imported on first start
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      # Public URL used by the browser and written into tokens as "iss".
      KC_HOSTNAME: http://localhost:8080
      # Lets the backend reach Keycloak internally via http://keycloak:8080.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    configs:
      - source: keycloak-realm
        target: /opt/keycloak/data/import/realm-phonebook.json
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl/wget, so the readiness endpoint is called via bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ---------------------------------------------------------------------------
  # .NET 10 backend API
  # ---------------------------------------------------------------------------
  backend:
    image: flipper130/phonebook-api:1.0.0
    build: ./backend
    restart: unless-stopped
    environment:
      ConnectionStrings__Phonebook: Host=postgres;Port=5432;Database=phonebook;Username=phonebook;Password=${APP_DB_PASSWORD:-phonebook}
      Keycloak__Issuer: http://localhost:8080/realms/phonebook
      Keycloak__MetadataAddress: http://keycloak:8080/realms/phonebook/.well-known/openid-configuration
      Keycloak__Audience: phonebook-api
    ports:
      - "5225:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Angular frontend served by nginx (also proxies /api to the backend)
  # ---------------------------------------------------------------------------
  frontend:
    image: flipper130/phonebook-frontend:1.0.0
    build: ./frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres-data:

configs:
  # Separate database and user for Keycloak and for the application, so neither
  # service can read or modify the other's data. ${...} values are filled in by Compose.
  postgres-init:
    content: |
      CREATE USER keycloak WITH PASSWORD '${KEYCLOAK_DB_PASSWORD:-keycloak}';
      CREATE DATABASE keycloak OWNER keycloak;

      CREATE USER phonebook WITH PASSWORD '${APP_DB_PASSWORD:-phonebook}';
      CREATE DATABASE phonebook OWNER phonebook;

  # Keycloak realm: public frontend client (authorization code + PKCE), an audience
  # mapper adding "phonebook-api" to access tokens, and two test users.
  # Imported only when the realm does not exist yet (`docker compose down -v` to re-import).
  keycloak-realm:
    content: |
      {
        "realm": "phonebook",
        "displayName": "Phonebook",
        "enabled": true,
        "registrationAllowed": false,
        "loginWithEmailAllowed": true,
        "sslRequired": "none",
        "clients": [
          {
            "clientId": "phonebook-frontend",
            "name": "Phonebook Angular frontend",
            "enabled": true,
            "publicClient": true,
            "protocol": "openid-connect",
            "standardFlowEnabled": true,
            "implicitFlowEnabled": false,
            "directAccessGrantsEnabled": false,
            "serviceAccountsEnabled": false,
            "rootUrl": "http://localhost:4200",
            "baseUrl": "/",
            "redirectUris": ["http://localhost:4200/*"],
            "webOrigins": ["http://localhost:4200"],
            "attributes": {
              "pkce.code.challenge.method": "S256",
              "post.logout.redirect.uris": "http://localhost:4200/*"
            },
            "protocolMappers": [
              {
                "name": "phonebook-api-audience",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-audience-mapper",
                "consentRequired": false,
                "config": {
                  "included.custom.audience": "phonebook-api",
                  "access.token.claim": "true",
                  "id.token.claim": "false",
                  "introspection.token.claim": "true"
                }
              }
            ]
          }
        ],
        "users": [
          {
            "username": "alice",
            "email": "alice@example.com",
            "emailVerified": true,
            "firstName": "Alice",
            "lastName": "Example",
            "enabled": true,
            "credentials": [{ "type": "password", "value": "alice", "temporary": false }]
          },
          {
            "username": "bob",
            "email": "bob@example.com",
            "emailVerified": true,
            "firstName": "Bob",
            "lastName": "Example",
            "enabled": true,
            "credentials": [{ "type": "password", "value": "bob", "temporary": false }]
          }
        ]
      }
